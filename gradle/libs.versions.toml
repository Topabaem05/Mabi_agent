[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
compose-bom = "2026.03.00"
activity-compose = "1.12.4"
lifecycle = "2.9.4"
datastore = "1.2.1"
room = "2.7.2"
koin = "4.1.1"
coroutines = "1.10.2"
core-ktx = "1.16.0"
appcompat = "1.7.1"
